name: Ping Server

on:
  workflow_dispatch:   # ✅ Lancer manuellement si besoin
  schedule:
    # Toutes les 8 minutes (cron en UTC)
    - cron: "*/8 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: |
          echo "Pinging server at $(date -u)"
          curl -s -o /dev/null -w "%{http_code}\n" https://ropainx.onrender.com || echo "Ping failed"
